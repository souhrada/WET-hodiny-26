<!doctype html>
<html lang="cs">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Efekty</title>

        <style>
            body {
                background: #222;
                display: flex;
                justify-content: center;
                align-items: center;
                min-height: 100vh;
                flex-direction: column;
                gap: 100px;
                overflow-x: hidden;
            }

            .kolecko {
                border: 10px solid rgb(104, 98, 98);
                border-top: 10px solid white;
                width: 200px;
                aspect-ratio: 1/1;
                border-radius: 50%;
                animation: toceni 1s linear forwards infinite;
            }

            @keyframes toceni {
                100% {
                    rotate: 360deg;
                }
            }

            .ctverecek {
                height: 200px;
                aspect-ratio: 1/1;
                box-shadow: 0px 0px 100px aqua;
                animation: stin 1s infinite linear alternate;
            }

            @keyframes stin {
                100% {
                    box-shadow: 0px 0px 70px rgb(255, 0, 0);
                }
            }

            h1 {
                color: white;
                font-family: monospace;
            }

            h1::before {
                content: "";
                background: linear-gradient(
                    90deg,
                    transparent 0%,
                    #222 5%,
                    #222 100%
                );
                position: absolute;
                width: 120%;
                height: 100%;
                left: 110%;

                animation: mizeni 3s linear forwards infinite;
            }

            @keyframes mizeni {
                100% {
                    left: -20%;
                }
            }
        </style>
    </head>
    <body>
        <div class="kolecko"></div>
        <div class="ctverecek"></div>
        <h1>Milujeme programování a webové technologie</h1>
    </body>
</html>

<!doctype html>
<html lang="cs">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Document</title>

        <style>
            .otesanek {
                height: 10rem;
                aspect-ratio: 1/1;
                border: none;
                background-color: purple;
                border-radius: 50%;
            }

            .kladivo {
                width: 5rem;
                margin-left: 5rem;
            }
        </style>
    </head>
    <body>
        <button class="otesanek"></button>
        <img src="hammer.png" alt="kladivo" class="kladivo" />
        <script>
            const otesanek = document.querySelector(".otesanek")
            const kladivo = document.querySelector(".kladivo")

            let pocetRem = 5
            otesanek.addEventListener("click", function () {
                // otesanek.style.height = "15rem"
                pocetRem += 10
                otesanek.style.height = pocetRem + "rem"
            })

            kladivo.addEventListener("click", reset)

            document.body.addEventListener("keydown", function (event) {
                if (event.key === "r") {
                    reset()
                }
            })

            function reset() {
                otesanek.style.height = "10rem"
                pocetRem = 5
            }
        </script>
    </body>
</html>
